<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda de Laura · serverless</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f8fb; color: #0E2841; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { color: #156082; margin: 0 0 4px; }
  .ruta { font-size: 13px; color: #44546A; margin: 0 0 16px; }
  .ruta b { color: #E97132; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(14,40,65,.08); margin-bottom: 14px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  input, select, button { font-size: 15px; padding: 8px 10px; border: 1px solid #dfe5ee; border-radius: 8px; }
  button { background: #156082; color: #fff; border: 0; cursor: pointer; }
  button.sec { background: #0F9ED5; }
  button.naranja { background: #E97132; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; }
  #estado { font: 13px ui-monospace, monospace; background: #0E2841; color: #e6edf3; border-radius: 8px; padding: 10px 12px; min-height: 20px; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #dfe5ee; font-size: 14px; }
  th { font-size: 12px; color: #8B98A9; }
  .inst { font: 12px ui-monospace, monospace; background: #e8f3f9; color: #156082; border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
  <h1>🛍️ Tienda de Laura</h1>
  <p class="ruta">Esta página vive en <b>S3</b> y llega por <b>CloudFront</b>. Cada pedido viaja a <b>API Gateway</b> → <b>Lambda</b> → <b>DynamoDB</b>. Ningún servidor prendido esperando.</p>

  <div class="card">
    <form id="f">
      <label>Cliente <input id="cliente" required maxlength="40" placeholder="camila"></label>
      <label>Producto
        <select id="producto"><option>camiseta</option><option>gorra</option><option>buzo</option></select>
      </label>
      <label>Talla
        <select id="talla"><option>S</option><option selected>M</option><option>L</option></select>
      </label>
      <button>Guardar pedido</button>
    </form>
  </div>

  <div class="card botones">
    <button class="sec" id="todos">Ver todos (Scan)</button>
    <button class="sec" id="uno">Ver solo este cliente (Query)</button>
    <button class="naranja" id="rafaga">⚡ Ráfaga: 20 pedidos a la vez</button>
  </div>

  <div class="card"><div id="estado">Lista. Guarda tu primer pedido.</div></div>

  <div class="card">
    <table>
      <thead><tr><th>cliente</th><th>fecha (UTC)</th><th>producto</th><th>talla</th><th>lo atendió</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

<script>
  var API = "${api}";
  var estado = document.getElementById("estado");

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function contar(r) {
    return (r.frio ? "🥶 arranque en frío" : "🔥 instancia caliente") + " · instancia " + r.instancia + " · " + r.ms + " ms dentro de la Lambda";
  }

  function pintar(r) {
    estado.textContent = r.operacion + ": " + r.pedidos.length + " pedido(s)\n" + contar(r);
    document.getElementById("lista").innerHTML = r.pedidos.map(function (p) {
      return "<tr><td>" + esc(p.cliente) + "</td><td>" + esc(String(p.fecha).split("#")[0]) + "</td><td>" + esc(p.producto) + "</td><td>" + esc(p.talla) + "</td><td><span class='inst'>" + esc(p.instancia) + "</span></td></tr>";
    }).join("");
  }

  function ver(cliente) {
    var url = API + (cliente ? "/?cliente=" + encodeURIComponent(cliente) : "/");
    return fetch(url).then(function (r) { return r.json(); }).then(pintar);
  }

  function guardar(pedido) {
    return fetch(API + "/", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(pedido) })
      .then(function (r) { return r.json(); });
  }

  function leerForm() {
    return {
      cliente: document.getElementById("cliente").value,
      producto: document.getElementById("producto").value,
      talla: document.getElementById("talla").value
    };
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    estado.textContent = "enviando a API Gateway…";
    guardar(leerForm()).then(function (r) {
      estado.textContent = "✅ " + r.operacion + ": pedido de " + r.pedido.cliente + " guardado en DynamoDB\n" + contar(r);
      return ver();
    }).catch(function (err) { estado.textContent = "❌ " + err; });
  });

  document.getElementById("rafaga").onclick = function () {
    var p = leerForm();
    if (!p.cliente) { p.cliente = "rafaga"; }
    estado.textContent = "⚡ enviando 20 pedidos al mismo tiempo…";
    var envios = [];
    for (var i = 0; i < 20; i++) {
      envios.push(fetch(API + "/", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(p) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; }));
    }
    Promise.all(envios).then(function (rs) {
      var inst = {}, frios = 0, frenados = 0;
      rs.forEach(function (r) {
        if (!r || !r.instancia) { frenados++; return; }
        inst[r.instancia] = (inst[r.instancia] || 0) + 1; if (r.frio) { frios++; }
      });
      var n = Object.keys(inst).length;
      estado.textContent = "⚡ " + (20 - frenados) + " de 20 pedidos guardados. AWS prendió " + n + " instancia(s) de la Lambda (" + frios + " arranque(s) en frío)\n" +
        Object.keys(inst).map(function (k) { return "instancia " + k + " → " + inst[k] + " pedido(s)"; }).join("\n") +
        (frenados ? "\n🚦 " + frenados + " frenado(s) por el límite de concurrencia de tu cuenta (las cuentas nuevas pueden empezar con 10)" : "");
      return fetch(API + "/").then(function (r) { return r.json(); }).then(function (r) {
        document.getElementById("lista").innerHTML = r.pedidos.map(function (x) {
          return "<tr><td>" + esc(x.cliente) + "</td><td>" + esc(String(x.fecha).split("#")[0]) + "</td><td>" + esc(x.producto) + "</td><td>" + esc(x.talla) + "</td><td><span class='inst'>" + esc(x.instancia) + "</span></td></tr>";
        }).join("");
      });
    }).catch(function (err) { estado.textContent = "❌ " + err; });
  };

  document.getElementById("todos").onclick = function () { ver(); };
  document.getElementById("uno").onclick = function () { ver(document.getElementById("cliente").value); };
  ver().catch(function () {});
</script>
</body>
</html>
