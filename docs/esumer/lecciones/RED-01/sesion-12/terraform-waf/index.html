<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda de Laura · protegida con WAF</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0E2841; color: #fff; text-align: center; }
  .caja { max-width: 560px; padding: 32px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p { color: #b4c8da; line-height: 1.5; }
  .escudo { font-size: 4rem; }
  code { background: #15304d; padding: 2px 8px; border-radius: 6px; color: #7cc4ff; }
</style>
</head>
<body>
  <div class="caja">
    <div class="escudo">🛡️</div>
    <h1>Tienda de Laura</h1>
    <p>Esta página vive en un bucket <b>S3 privado</b>, sale por <b>CloudFront</b> con HTTPS y la cuida un <b>WAF</b>.</p>
    <p>Hecha por: <b>TU NOMBRE</b></p>
    <p>Prueba: <code>?buscar=camiseta</code> pasa · un ataque recibe <code>403</code></p>
  </div>
</body>
</html>
