name: Deploy Alejandro Barrera

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform
  SITE_DIR: site
  ENVIRONMENT: pdn
  # Alias alejandrobarrera.net ya liberado de la distro legacy (EZ6LM98O6TRNJ).
  # Cutover activado: la distro nueva reclama el alias + Route53 apunta a ella.
  ENABLE_CUSTOM_DOMAIN: "true"
  # Encender cuando el registro de iaopslatam.com complete (redirect 301).
  ENABLE_IAOPSLATAM: "true"
  # Registro defensivo del término AI SRE: 301 -> iaopslatam.com.
  # Encender cuando los registros de aisrelatam.com/iasrelatam.com completen.
  ENABLE_AISRE_REDIRECT: "false"
  TF_BACKEND_BUCKET: essionix-s3-pdn-us-east-1-remotestates
  OIDC_ROLE_ARN: arn:aws:iam::484005000536:role/essionix-role-pdn-us-east-1-oidc

jobs:
  infra:
    name: Provisionar infraestructura (Terraform)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      BUCKET_NAME: ${{ steps.tf-output.outputs.bucket_name }}
      DISTRIBUTION_ID: ${{ steps.tf-output.outputs.distribution_id }}
      REGISTER_URL: ${{ steps.tf-output.outputs.register_url }}
      IAOPS_BUCKET: ${{ steps.tf-output.outputs.iaops_bucket }}
      IAOPS_DIST: ${{ steps.tf-output.outputs.iaops_dist }}
      PAGOS_INICIAR_URL: ${{ steps.tf-output.outputs.pagos_iniciar_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform init (backend remoto S3)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${{ github.event.repository.name }}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Pruebas unitarias de las Lambdas de pagos
        working-directory: terraform/lambda
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt
          .venv/bin/pytest tests/ -v

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_enable_custom_domain: ${{ env.ENABLE_CUSTOM_DOMAIN }}
          TF_VAR_enable_iaopslatam: ${{ env.ENABLE_IAOPSLATAM }}
          TF_VAR_enable_aisre_redirect: ${{ env.ENABLE_AISRE_REDIRECT }}
          TF_VAR_wompi_public_key: ${{ secrets.WOMPI_PUBLIC_KEY }}
          TF_VAR_wompi_private_key: ${{ secrets.WOMPI_PRIVATE_KEY }}
          TF_VAR_wompi_integrity_secret: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          TF_VAR_wompi_events_secret: ${{ secrets.WOMPI_EVENTS_SECRET }}
          TF_VAR_calcom_api_key: ${{ secrets.CALCOM_API_KEY }}
          TF_VAR_calcom_webhook_secret: ${{ secrets.CALCOM_WEBHOOK_SECRET }}
        run: terraform apply -auto-approve -input=false

      - name: Exportar outputs de Terraform
        id: tf-output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "bucket_name=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "register_url=$(terraform output -raw register_url)" >> "$GITHUB_OUTPUT"
          echo "iaops_bucket=$(terraform output -raw iaops_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "iaops_dist=$(terraform output -raw iaops_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "pagos_iniciar_url=$(terraform output -raw pagos_iniciar_url)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publicar sitio (S3 sync + invalidación CloudFront)
    runs-on: ubuntu-latest
    needs: infra

    permissions:
      id-token: write
      contents: read

    env:
      BUCKET_NAME: ${{ needs.infra.outputs.BUCKET_NAME }}
      DISTRIBUTION_ID: ${{ needs.infra.outputs.DISTRIBUTION_ID }}
      REGISTER_URL: ${{ needs.infra.outputs.REGISTER_URL }}
      IAOPS_BUCKET: ${{ needs.infra.outputs.IAOPS_BUCKET }}
      IAOPS_DIST: ${{ needs.infra.outputs.IAOPS_DIST }}
      PAGOS_INICIAR_URL: ${{ needs.infra.outputs.PAGOS_INICIAR_URL }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache-busting de CSS/JS (versionar por commit)
        run: |
          # styles.css -> styles.css?v=<sha>  y  script.js -> script.js?v=<sha>
          # URL nueva en cada deploy: el navegador baja la version nueva sin
          # hard-reload, complementando la invalidacion de CloudFront.
          VER="${GITHUB_SHA::8}"
          find "${SITE_DIR}" site-iaops -name "*.html" -print0 | xargs -0 sed -i \
            -e "s|/styles\.css\"|/styles.css?v=${VER}\"|g" \
            -e "s|/script\.js\"|/script.js?v=${VER}\"|g" \
            -e "s|__REGISTER_ENDPOINT__|${REGISTER_URL}|g" \
            -e "s|__PAGOS_ENDPOINT__|${PAGOS_INICIAR_URL}|g"
          echo "Assets versionados con ?v=${VER} y endpoints inyectados"
          grep -o 'styles\.css?v=[a-f0-9]*\|script\.js?v=[a-f0-9]*' "${SITE_DIR}/index.html" || true

      - name: Sincronizar assets (img/css/js/svg) con caché moderada
        run: |
          if [ -z "${BUCKET_NAME}" ]; then
            echo "BUCKET_NAME vacio; revisa el output de Terraform."
            exit 1
          fi
          # Caché de 1h (no immutable). CSS/JS van versionados con ?v=<sha>.
          aws s3 sync "${SITE_DIR}/" "s3://${BUCKET_NAME}/" \
            --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public,max-age=3600"

      - name: Sincronizar HTML/SEO con caché corta
        run: |
          aws s3 sync "${SITE_DIR}/" "s3://${BUCKET_NAME}/" \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public,max-age=300"

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Publicar iaopslatam.com
        run: |
          if [ -z "${IAOPS_BUCKET}" ]; then echo "iaopslatam desactivado"; exit 0; fi
          aws s3 sync "site-iaops/" "s3://${IAOPS_BUCKET}/" \
            --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public,max-age=3600"
          aws s3 sync "site-iaops/" "s3://${IAOPS_BUCKET}/" \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public,max-age=300"
          aws cloudfront create-invalidation --distribution-id "${IAOPS_DIST}" --paths "/*"
